{% load static %}
{% load n_tags %}
{% data_register as dr %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Регистрация в Бюро находок">
    <title>{{dr.title}} - Бюро находок</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{% static 'naxodki/css/registration.css' %}">
</head>
<body>
    <main class="container">
        <section id="register-screen" class="form-screen">
            <!-- Logo -->
            <div class="logo" role="img" aria-label="Бюро находок логотип">
                <i class="fas fa-planet-ringed" aria-hidden="true"></i>
                <span>Бюро находок</span>
            </div>

            <!-- Registration Form -->
            <form id="registration-form" novalidate>
                <!-- Name Input -->
                <div class="input-group" id="name-group">
                    <label for="nameInput" class="label-text">{{dr.name}}</label>
                    <i class="fas fa-user-circle" aria-hidden="true"></i>
                    <input
                        type="text"
                        id="nameInput"
                        name="name"
                        placeholder="Baxriddin Sohibov"
                        required
                        aria-required="true"
                        aria-describedby="name-error"
                    >
                    <span class="error-message" id="name-error"></span>
                </div>

                <!-- Phone Input -->
                <div class="input-group" id="phone-group">
                    <label for="phoneInput" class="label-text">{{dr.tel}}</label>
                    <i class="fas fa-phone-alt" aria-hidden="true"></i>
                    <input
                        type="tel"
                        id="phoneInput"
                        name="phone"
                        placeholder="+998 91 043 40 49"
                        required
                        aria-required="true"
                        aria-describedby="phone-error"
                    >
                    <span class="error-message" id="phone-error"></span>
                </div>

                <!-- Email Input -->
                <div class="input-group" id="email-group-reg">
                    <label for="emailInputReg" class="label-text">{{dr.email}}</label>
                    <i class="fas fa-envelope" aria-hidden="true"></i>
                    <input
                        type="email"
                        id="emailInputReg"
                        name="email"
                        placeholder="yagzugaming@gmail.com"
                        required
                        aria-required="true"
                        aria-describedby="email-error"
                    >
                    <span class="error-message" id="email-error"></span>
                </div>

                <!-- Password Input -->
                <div class="input-group" id="password-group-reg">
                    <label for="passwordInputReg" class="label-text">{{dr.password}}</label>
                    <i class="fas fa-key" aria-hidden="true"></i>
                    <input
                        type="password"
                        id="passwordInputReg"
                        name="password"
                        placeholder="**********"
                        required
                        aria-required="true"
                        aria-describedby="password-error"
                    >
                    <i class="fas fa-eye toggle-password" role="button" tabindex="0" aria-label="Показать пароль" aria-hidden="true"></i>
                    <span class="error-message" id="password-error"></span>
                </div>

                <!-- Confirm Password Input -->
                <div class="input-group" id="confirm-password-group">
                    <label for="confirmPasswordInput" class="label-text">{{dr.ver_pas}}</label>
                    <i class="fas fa-key" aria-hidden="true"></i>
                    <input
                        type="password"
                        id="confirmPasswordInput"
                        name="confirm_password"
                        placeholder="**********"
                        required
                        aria-required="true"
                        aria-describedby="confirm-error"
                    >
                    <i class="fas fa-eye toggle-password" role="button" tabindex="0" aria-label="Показать пароль" aria-hidden="true"></i>
                    <span class="error-message" id="confirm-error"></span>
                </div>

                <!-- Divider -->
                <div class="divider" aria-hidden="true"></div>

                <!-- Social Buttons -->
                <button type="button" class="btn btn-social" aria-label="Продолжить с Google">
                    <img src="https://img.icons8.com/color/16/000000/google-logo.png" alt="Google" loading="lazy">
                    <span>Google orqali davom etish</span>
                </button>

                <button type="button" class="btn btn-social" aria-label="Продолжить с Facebook">
                    <i class="fab fa-facebook-f" style="color: #1877F2;" aria-hidden="true"></i>
                    <span>Facebook orqali davom etish</span>
                </button>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" id="register-submit-btn">{{dr.register}}</button>
            </form>

            <!-- Footer Text -->
            <div class="footer-text">
                <span>{{dr.have}}</span>
                <a href="{% url 'login_client' %}" title="Перейти на страницу входа">{{dr.login}}</a>
            </div>
        </section>
    </main>

    <script src="{% static 'naxodki/js/script2.js' %}" defer></script>
</body>
</html>
